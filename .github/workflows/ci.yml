name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: lint + test + build (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Fyne build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc pkg-config \
            libgl1-mesa-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxxf86vm-dev xorg-dev

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      # golangci-lint covers govet, so there's no separate vet step. It also
      # runs `modernize`, which is what stops the tree drifting back to older
      # idioms as Go moves on. Needs the Fyne deps installed above, since it
      # type-checks the cgo-backed GUI packages like any other build.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      # gofmt is enforced via the config's formatters section; `fmt --diff`
      # fails the job and prints exactly what to apply.
      - name: gofmt check
        run: golangci-lint fmt --diff ./...

      - name: go test (race)
        run: go test -race -count=1 -timeout 5m ./...
        env:
          CGO_ENABLED: '1'

      - name: go build
        run: go build ./cmd/edcolreport
        env:
          CGO_ENABLED: '1'
